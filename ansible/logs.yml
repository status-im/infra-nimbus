---
- name: Verify Ansible versions
  hosts: all
  tags: always
  become: false
  run_once: true
  gather_facts: false
  tasks:
    - local_action: command ./roles.py --check
      changed_when: false

- name: Configure ElasticSearch servers
  become: true
  hosts: nimbus-logs-store
  vars_files:
    - vars/vault-pki/nimbus-logs-search.yml
  pre_tasks:
    - name: Enable Maintenance Mode
      command: 'maintenance Ansible run by {{ lookup("env", "USER") }}'
      tags: always
  post_tasks:
    - name: Disable Maintenance Mode
      command: 'maintenance disable'
      tags: always
  roles:
    - { role: infra-role-swap-file,        tags: swap-file }
    - { role: infra-role-open-ports,       tags: open-ports }
    - { role: infra-role-vault-pki,        tags: vault-pki }
    - { role: infra-role-elasticsearch,    tags: elasticsearch }
    - { role: logclean-job,                tags: logclean-job }
