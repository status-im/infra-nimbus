---
# Passwords
bootstrap__active_users_passwords:            '{{ bootstrap__active_users | get_user_passwords }}'
bootstrap__admin_pass:                        '{{lookup("vault", "users", field="admin", env="all", stage="all")}}'
bootstrap__root_pass:                         '{{lookup("vault", "users", field="root",  env="all", stage="all")}}'
# Consul
consul_dc:                                    '{{ bootstrap__consul_data_center | default(data_center) | mandatory }}'
bootstrap__consul_agent_acl_token:            '{{lookup("vault", "consul/acl-tokens/"+consul_dc, field="agent-default",        env="all", stage="all")}}'
bootstrap__consul_agent_admin_token:          '{{lookup("vault", "consul/acl-tokens/"+consul_dc, field="agent-admin",          env="all", stage="all")}}'
bootstrap__consul_service_registration_token: '{{lookup("vault", "consul/acl-tokens/"+consul_dc, field="service-registration", env="all", stage="all")}}'
bootstrap__consul_encryption_key:             '{{lookup("vault", "consul/config",                field="encryption-key",       env="all", stage="all")}}'
bootstrap__consul_certs_ca_crt:               '{{lookup("vault", "consul/certs",                 field="ca.pem",               env="all", stage="all")}}'
bootstrap__consul_certs_client_crt:           '{{lookup("vault", "consul/certs",                 field="client.pem",           env="all", stage="all")}}'
bootstrap__consul_certs_client_key:           '{{lookup("vault", "consul/certs",                 field="client-key.pem",       env="all", stage="all")}}'
# SSHGuard
bootstrap__sshguard_whitelist_extra:          ['{{lookup("vault", "sshguard/whitelist",          field="jakubgs-home",         env="all", stage="all")}}']
# Vault
bootstrap__vault_ca_cert:                     '{{ lookup("community.general.passwordstore", "services/vault/certs/ca-chain",            returnall=true)}}'
bootstrap__vault_client_cert:                 '{{ lookup("community.general.passwordstore", "services/vault/certs/client-host/cert",    returnall=true)}}'
bootstrap__vault_client_key:                  '{{ lookup("community.general.passwordstore", "services/vault/certs/client-host/privkey", returnall=true)}}'

# Wireguard
wireguard_consul_acl_token:                   '{{lookup("vault", "consul/acl-tokens/global", field="wireguard",          env="all", stage="all")}}'
# Wazuh Agent
wazuh_agent_enrollment_key:                   '{{ lookup("vault", "manager/config", field="enrollment-password",  env="hq",  stage="wazuh")}}'
wazuh_root_ca:                                '{{ lookup("vault", "root-ca",        field="certificate",          env="hq",  stage="wazuh")}}'
