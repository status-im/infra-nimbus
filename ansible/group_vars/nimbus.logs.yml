---
bootstrap__rsyslog_docker_logs_path: '/var/log/docker'
# Syncing can use a lot of memory
swap_file_path: '/main.swap'
swap_file_size_mb: 16384

# ElasticSearch Cluster
es_service_name: 'elasticsearch'
es_service_path: '/docker/{{ es_service_name }}'
es_cluster_name: 'nimbus-logs-search'
es_docker_network_name: '{{ es_service_name }}'
es_api_port: 9200
es_node_port: 9300
es_node_cont_tag: '7.17.28'
es_exp_cont_port: 9114
es_master_nodes: |
  {{ ansible_play_hosts
   | map('extract', hostvars)
   | list
   | json_query(
   '[].{
     name: inventory_hostname,
     addr: ansible_local.wireguard.vpn_ip,
     port: to_string(es_node_port)
   }') }}

# Authentication, Roles, Users. See ansible/vars/vault-pki/nimbus-logs-search.yml for PKI config.
es_security_enabled: true
es_transport_certs_path: '{{ es_node_host_config_path }}/certs'
es_transport_pem_path: '{{ es_transport_certs_path }}/{{ hostname }}.wg.pem'
es_transport_key_path: '{{ es_transport_certs_path }}/{{ hostname }}.wg.key'
es_transport_ca_pem_path: '{{ es_transport_certs_path }}/{{ vault_pki_ca_key_name }}.pem'
es_admin_username: 'elastic' # HARDCODED
es_admin_password: '{{ lookup("vault", "elasticsearch/users", field="elastic") }}'
es_roles:
  - name: 'logstash_writer'
    cluster: ['monitor', 'manage_index_templates']
    indices:
      - names: ['logstash-*']
        privileges: ['write', 'create', 'create_index']

es_users:
  - name: 'logstash'
    pass: '{{ lookup("vault", "elasticsearch/users", field="logstash") }}'
    full_name: 'Logstash Writer User'
    roles: ['logstash_writer']
    enabled: true

  - name: 'kibana_guest'
    pass: '{{ lookup("vault", "elasticsearch/users", field="kibana_guest") }}'
    full_name: 'Kibana guest user for anonymous login'
    roles: ['viewer']
    enabled: true

  - name: 'es_comrade'
    pass: '{{ lookup("vault", "elasticsearch/users", field="es_comrade") }}'
    full_name: 'ElasticSearch Admin Panel'
    roles: ['remote_monitoring_collector', 'viewer']
    enabled: true

  # Built-in users
  - name: 'apm_system'
    pass: '{{ lookup("vault", "elasticsearch/users", field="apm_system") }}'
  - name: 'beats_system'
    pass: '{{ lookup("vault", "elasticsearch/users", field="beats_system") }}'
  - name: 'kibana_system'
    pass: '{{ lookup("vault", "elasticsearch/users", field="kibana_system") }}'
  - name: 'logstash_system'
    pass: '{{ lookup("vault", "elasticsearch/users", field="logstash_system") }}'
  - name: 'remote_monitoring_user'
    pass: '{{ lookup("vault", "elasticsearch/users", field="remote_monitoring_user") }}'


# Since Logstash stores 1 index per day this is fine.
# See: https://www.elastic.co/blog/how-many-shards-should-i-have-in-my-elasticsearch-cluster
es_number_of_shards: 3
# Since Nimbus logs are low-value we don't need replicas.
es_number_of_replicas: 0
# Bump due to large number of fields in JSON logs.
es_mapping_total_fields_limit: 1500

# Query optimization to not search throguh all fields. Can be a list.
es_default_query_default_field: ['json.msg']

# JVM Memory settings
es_jvm_g1gc_enabled: true
es_jvm_heap_auto: false
es_jvm_min_heap: 40g
es_jvm_max_heap: 40g

# Cleanup to avoid running out of space
logclean_es_host: 'localhost'
logclean_es_port: '{{ es_api_port }}'
logclean_keep_indices: 21
logclean_timer_frequency: 'daily'

# Open Ports
open_ports_default_comment: 'ElasticSearch'
open_ports_list: '{{ open_ports_base | combine(open_ports_extra|default({}), recursive=true) }}'
open_ports_base:
  elasticsearch:
    - { port: '{{ es_api_port  }}',              ipset: 'hq.metrics',  iifname: 'wg0' }
    - { port: '{{ es_api_port  }}',              ipset: 'hq.logs',     iifname: 'wg0' }
    - { port: '{{ es_node_port }}',              ipset: 'hq.logs',     iifname: 'wg0' }
    - { port: '{{ es_api_port }}',               ipset: 'nimbus.logs', iifname: 'wg0' }
    - { port: '{{ es_node_port }}',              ipset: 'nimbus.logs', iifname: 'wg0' }
  elasticsearch_metrics:
    - { port: '{{ es_exp_cont_port }}',          ipset: 'hq.metrics',  iifname: 'wg0' }
