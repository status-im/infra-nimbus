---
- name: Verify Ansible versions
  hosts: all
  tags: always
  become: false
  run_once: true
  gather_facts: false
  tasks:
    - local_action: command ./roles.py --check
      changed_when: false

- name: Configure ERA, ERA1, ERE and DB files hosting
  become: true
  hosts:
    - erigon-01.ih-eu-mda1.nimbus.mainnet
    - geth-01.ih-eu-mda1.nimbus.hoodi
    - libp2p-01.ih-eu-mda1.nimbus.hoodi
    - linux-01.ih-eu-mda1.nimbus.sepolia
    - nec-01.ih-eu-mda1.nimbus.mainnet
    - nec-02.ih-eu-mda1.nimbus.mainnet
    - nec-01.ih-eu-mda1.nimbus.hoodi
  pre_tasks:
    - name: Enable Maintenance Mode
      command: 'maintenance Ansible run by {{ lookup("env", "USER") }}'
      tags: always
  post_tasks:
    - name: Disable Maintenance Mode
      command: 'maintenance disable'
      tags: always
  roles:
    - { role: infra-role-origin-certs, tags: origin-certs     }
    - { role: infra-role-nginx,        tags: nginx            }
